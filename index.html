<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infinity Price | Inteligência em Custos</title>
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-gradient"></div>
    
    <div class="container">
        <header class="main-header">
            <div class="logo">
                <i class="fas fa-chart-line"></i>
                <h1>Infinity<span>Price</span></h1>
            </div>
            <p>Transforme seus custos em lucro real</p>
        </header>

        <main class="dashboard">
            <!-- Coluna de Inputs -->
            <div class="input-section">
                <div class="card">
                    <h3><i class="fas fa-box-open"></i> Custos Diretos</h3>
                    <div class="input-wrapper">
                        <label>Matéria-prima</label>
                        <div class="field">
                            <span>R$</span>
                            <input type="number" id="mat" placeholder="0,00">
                        </div>
                    </div>
                    <div class="input-wrapper">
                        <label>Mão de Obra</label>
                        <div class="field">
                            <span>R$</span>
                            <input type="number" id="labor" placeholder="0,00">
                        </div>
                    </div>
                </div>

                <div class="card">
                    <h3><i class="fas fa-percent"></i> Margens e Taxas</h3>
                    <div class="grid-inputs">
                        <div class="input-wrapper">
                            <label>Margem (%)</label>
                            <input type="number" id="markup" placeholder="30">
                        </div>
                        <div class="input-wrapper">
                            <label>Impostos (%)</label>
                            <input type="number" id="tax" placeholder="6">
                        </div>
                    </div>
                </div>
            </div>

            <!-- Coluna de Resultado -->
            <div class="result-section">
                <div class="card summary-card">
                    <span class="label-highlight">Preço Sugerido</span>
                    <div class="main-price">
                        <small>R$</small>
                        <strong id="final-price">0,00</strong>
                    </div>
                    
                    <div class="stats-row">
                        <div class="stat">
                            <span>Custo Total</span>
                            <b id="total-cost-view">R$ 0,00</b>
                        </div>
                        <div class="stat">
                            <span>Lucro Bruto</span>
                            <b id="profit-view">R$ 0,00</b>
                        </div>
                    </div>

                    <button class="action-btn" onclick="calculate()">
                        Atualizar Cálculos <i class="fas fa-sync-alt"></i>
                    </button>
                </div>
            </div>
        </main>
    </div>
    <script src="index.js"></script>
</body>
</html>

            <section class="card">
                <h2>Margem e Impostos</h2>
                <div class="input-group">
                    <label for="markup">Margem de Lucro Desejada (%)</label>
                    <input type="number" id="markup" placeholder="ex: 30">
                </div>
                <div class="input-group">
                    <label for="taxes">Impostos e Taxas (%)</label>
                    <input type="number" id="taxes" placeholder="ex: 10">
                </div>
            </section>

            <!-- Resultado -->
            <section class="card result-card">
                <h2>Preço de Venda Sugerido</h2>
                <div class="price-display">
                    <span class="currency">R$</span>
                    <span id="final-price">0,00</span>
                </div>
                <button class="btn-calculate" onclick="calculatePrice()">Calcular Preço</button>
                <p class="profit-info">Lucro bruto estimado: <span id="profit-value">R$ 0,00</span></p>
            </section>
        </main>
    </div>
    <script src="index.js"></script>
</body>
</html>
